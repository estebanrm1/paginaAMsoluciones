[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# Seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    # GA4 y Plausible habilitados en la CSP; solo se cargan si se configuran PUBLIC_GA4_ID / PUBLIC_PLAUSIBLE_DOMAIN.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://plausible.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# URLs del sitio anterior (React SPA) → nuevas rutas, para no perder enlaces ni posicionamiento
[[redirects]]
  from = "/inicio"
  to = "/"
  status = 301
[[redirects]]
  from = "/servicios/cv_basico"
  to = "/soluciones/desarrollo-web"
  status = 301
[[redirects]]
  from = "/servicios/sitio_personal"
  to = "/soluciones/desarrollo-web"
  status = 301
[[redirects]]
  from = "/servicios/pagina_info"
  to = "/soluciones/desarrollo-web"
  status = 301
[[redirects]]
  from = "/sobre_nosotros"
  to = "/nosotros"
  status = 301
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon-48.png"
  status = 200
[[redirects]]
  from = "/A.M.jpg"
  to = "/og.png"
  status = 301
